server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # O Vite gera nomes com hash de conteudo, entao esses arquivos nunca mudam
    # sem mudar de nome e podem ser cacheados indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index.html precisa ser sempre revalidado: e ele que aponta para o hash
    # novo dos assets a cada deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback de SPA: rotas do vue-router (/events, /vendors/...) nao existem
    # em disco e precisam cair no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
